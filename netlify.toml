# Configuração do deploy na Netlify.
#
# Este arquivo fica na RAIZ do repositório, que é onde a Netlify procura por
# ele. O site em si mora em `site/`, então `base` aponta para lá e os demais
# caminhos passam a ser relativos a essa pasta (`publish = "dist"` vira
# `site/dist`).
#
# Não é preciso preencher nada no painel: basta conectar o repositório e
# escolher a branch.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # O Vite 7 exige Node 20.19 ou superior.
  NODE_VERSION = "22"

# A landing é uma página só: qualquer rota cai no index. Os arquivos que
# existem de verdade (política de privacidade, imagens, fontes) continuam
# sendo servidos direto, porque a Netlify tenta o arquivo antes do redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
