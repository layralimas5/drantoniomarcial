# Configuração do deploy na Netlify.
#
# O projeto inteiro vive na raiz do repositório, que é também onde a Netlify
# procura por este arquivo. Não é preciso preencher nada no painel: basta
# conectar o repositório e escolher a branch.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # O Vite 7 exige Node 20.19 ou superior.
  NODE_VERSION = "22"

# A landing é uma página só: qualquer rota cai no index. Os arquivos que
# existem de verdade (política de privacidade, imagens, fontes) continuam
# sendo servidos direto, porque a Netlify tenta o arquivo antes do redirect.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
