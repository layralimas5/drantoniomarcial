<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Formulários</title>
  </head>
  <body>
    <!-- Arquivo lido pelo Netlify no deploy para registrar o formulário. Não é acessado por usuários. -->
    <form name="avaliacao" netlify netlify-honeypot="empresa" hidden>
      <input type="text" name="nome" />
      <input type="tel" name="telefone" />
      <textarea name="mensagem"></textarea>
      <input type="text" name="empresa" />
    </form>
  </body>
</html>
